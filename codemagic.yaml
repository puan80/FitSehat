workflows:
  fitsehat-debug-apk:
    name: FitSehat Installable APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Check environment
        script: |
          java -version
          gradle --version || true
      - name: Install Gradle 8.9
        script: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-8.9/bin:$PATH"
          gradle --version
          echo 'export PATH="/tmp/gradle-8.9/bin:$PATH"' >> $CM_ENV
      - name: Build installable APK
        script: |
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk FitSehat-v1.0-install.apk
    artifacts:
      - FitSehat-v1.0-install.apk
      - app/build/outputs/**/*.apk
